    <script>
      // Cleanly suppress Vite HMR WebSocket connection noise in iframe environment
      (function() {
        const origWarn = console.warn;
        const origError = console.error;
        console.warn = function(...args) {
          if (args[0] && typeof args[0] === 'string' && args[0].includes('[vite]')) return;
          origWarn.apply(console, args);
        };
        console.error = function(...args) {
          if (args[0] && typeof args[0] === 'string' && (args[0].includes('[vite]') || args[0].includes('WebSocket'))) return;
          origError.apply(console, args);
        };
      })();
    </script>
